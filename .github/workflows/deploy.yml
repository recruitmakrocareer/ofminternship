name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# สิทธิ์ที่ deploy-pages ต้องใช้
permissions:
  contents: read
  pages: write
  id-token: write

# ให้ deploy ทีละครั้ง (ยกเลิก run เก่าที่ค้าง)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # ตั้งค่าใน repo Settings → Secrets and variables → Actions
          #  - Variables: VITE_APPS_SCRIPT_URL, VITE_BASE_PATH, VITE_LOOKER_STUDIO_URL
          #  - Secrets:   VITE_SUBMIT_TOKEN
          VITE_APPS_SCRIPT_URL: ${{ vars.VITE_APPS_SCRIPT_URL }}
          VITE_SUBMIT_TOKEN: ${{ secrets.VITE_SUBMIT_TOKEN }}
          VITE_LOOKER_STUDIO_URL: ${{ vars.VITE_LOOKER_STUDIO_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
